services:
  agent-api:
    image: python:3.12-slim
    command: uvicorn server:app --host 0.0.0.0 --port 8000
    # INSECURE: Exposing SSH port directly to 0.0.0.0 public ingress
    expose:
      - 22
    # Target compute instance for Linode Cloud Firewall Shield
    linode_id: 12345
    restart: unless-stopped
